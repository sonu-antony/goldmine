version: 2

sources:
  - name: product
    description: The product database, loaded into the raw schema.
    schema: raw
    tables:
      - name: product_workspaces
        description: One row per customer account.
        columns:
          - name: id
            description: Source identifier. Repeats mean a load was retried or overlapped.
            data_tests:
              - unique:
                  config:
                    severity: warn
      - name: product_users
        description: One row per person inside a workspace.
        columns:
          - name: id
            description: Source identifier. Repeats mean a load was retried or overlapped.
            data_tests:
              - unique:
                  config:
                    severity: warn
      - name: product_messages
        description: One row per message sent or received. The largest table, loaded incrementally.
        columns:
          - name: id
            description: Source identifier. Repeats mean a load was retried or overlapped.
            data_tests:
              - unique:
                  config:
                    severity: warn
