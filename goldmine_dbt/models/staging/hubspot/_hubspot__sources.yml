version: 2

sources:
  - name: hubspot
    description: HubSpot CRM data, loaded into the raw schema.
    schema: raw
    tables:
      - name: hubspot_companies
        description: One row per company the sales team tracks.
        columns:
          - name: id
            description: Source identifier. Repeats mean a load was retried or overlapped.
            data_tests:
              - unique:
                  config:
                    severity: warn
      - name: hubspot_deals
        description: One row per sales opportunity.
        columns:
          - name: id
            description: Source identifier. Repeats mean a load was retried or overlapped.
            data_tests:
              - unique:
                  config:
                    severity: warn
