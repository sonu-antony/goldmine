version: 2

models:
  - name: stg_hubspot__companies
    description: HubSpot companies, cleaned. The domain is normalised (no protocol, no www, lower case).
    columns:
      - name: company_id
        data_tests: [unique, not_null]
      - name: domain
        description: Normalised domain. The same company can be entered twice by different salespeople.
        data_tests:
          # Source problem: duplicate companies share a domain.
          - unique:
              config:
                severity: warn
      - name: chargebee_customer_id
        description: Link to the billing customer. A plain value, often empty or wrong.
        data_tests:
          # Source problem: some links point at customers that do not exist.
          - relationships:
              arguments:
                to: ref('stg_chargebee__customer')
                field: customer_id
              config:
                severity: warn

  - name: stg_hubspot__deals
    description: One row per sales opportunity.
    columns:
      - name: deal_id
        data_tests: [unique, not_null]
      - name: company_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_hubspot__companies')
                field: company_id
      - name: deal_stage
        data_tests:
          - accepted_values:
              arguments:
                values: [appointment_scheduled, qualified_to_buy, contract_sent, closed_won, closed_lost]
