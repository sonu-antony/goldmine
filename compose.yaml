services:
  postgres:
    image: docker.io/library/postgres:16
    container_name: goldmine-postgres
    environment:
      POSTGRES_USER: goldmine
      POSTGRES_PASSWORD: goldmine
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goldmine"]
      interval: 5s
      retries: 10

  metabase:
    image: docker.io/metabase/metabase:latest
    container_name: goldmine-metabase
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Metabase keeps its own settings in a file database on a volume, separate from the warehouse.
      MB_DB_FILE: /metabase-data/metabase.db
    ports:
      - "3030:3000"
    volumes:
      - metabase-data:/metabase-data

volumes:
  pgdata:
  metabase-data:
